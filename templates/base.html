<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Movies{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Movie App</h1>
        <nav>
            <a href="{% url 'movies:list' %}">Home</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Child templates will fill this block -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 My Movie App</p>
    </footer>
</body>
</html>
